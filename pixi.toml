[workspace]
name = "raman-bayes"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]
requires-pixi = ">=0.83"

# Runtime dependencies (mirrors [project].dependencies in pyproject.toml).
[dependencies]
python = ">=3.11,<3.14"
numpy = ">=1.26"
scipy = ">=1.11"
pyarrow = ">=15"
zarr = ">=3.0,<4"
pydantic = ">=2.6,<3"
typer = ">=0.12"
rich = ">=13"
pyyaml = ">=6"
pydantic-settings = ">=2.16.2,<3"
blake3 = ">=1.0.11,<2"

[pypi-dependencies]
raman-bayes = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = ">=8"
hypothesis = ">=6.100"
ruff = ">=0.6"
mypy = ">=1.11"
import-linter = ">=2.0"
pre-commit = ">=3.7"
types-pyyaml = ">=6"
hatchling = ">=1.24"
python-duckdb = ">=2.0.0,<3"
pytest-cov = ">=7.1.0,<8"
deptry = ">=0.25.1,<0.26"

[feature.dev.tasks]
# --cov=raman_bayes, not bare --cov: --cov takes an optional value, so an appended test path
# would be read as the coverage source. Run a subset with `pixi run test --no-cov PATH`.
test = "pytest --cov=raman_bayes"
lint = { depends-on = ["lint-ruff", "lint-format", "lint-types", "lint-imports", "lint-deps"] }
lint-ruff = "ruff check ."
lint-format = "ruff format --check ."
lint-types = "mypy"
# --no-cache: no .import_linter_cache/ in the tree (the tests also plant violations in tmp copies).
lint-imports = "lint-imports --no-cache"
lint-deps = "deptry src"
fmt = "ruff format . && ruff check --fix ."
gen-schemas = "python scripts/gen_schemas.py"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[environments]
default = { features = ["dev", "py313"], solve-group = "py313" }
py311 = { features = ["dev", "py311"], solve-group = "py311" }
py312 = { features = ["dev", "py312"], solve-group = "py312" }
py313 = { features = ["dev", "py313"], solve-group = "py313" }
