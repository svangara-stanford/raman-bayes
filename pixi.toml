[workspace]
name = "raman-bayes"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]
requires-pixi = ">=0.83"

# Runtime dependencies (mirrors [project].dependencies in pyproject.toml).
[dependencies]
python = ">=3.11,<3.14"
numpy = ">=1.26"
scipy = ">=1.11"
pyarrow = ">=15"
zarr = ">=3.0,<4"
pydantic = ">=2.6,<3"
typer = ">=0.12"
rich = ">=13"
pyyaml = ">=6"
python-duckdb = ">=1.0"

[pypi-dependencies]
raman-bayes = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = ">=8"
hypothesis = ">=6.100"
ruff = ">=0.6"
mypy = ">=1.11"
import-linter = ">=2.0"
pre-commit = ">=3.7"
types-pyyaml = ">=6"

[feature.dev.tasks]
test = "pytest"
lint = { depends-on = ["lint-ruff", "lint-format", "lint-types", "lint-imports"] }
lint-ruff = "ruff check ."
lint-format = "ruff format --check ."
lint-types = "mypy"
# --no-cache: no .import_linter_cache/ in the tree (the tests also plant violations in tmp copies).
lint-imports = "lint-imports --no-cache"
fmt = "ruff format . && ruff check --fix ."
gen-schemas = "python scripts/gen_schemas.py"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[environments]
default = { features = ["dev", "py313"], solve-group = "py313" }
py311 = { features = ["dev", "py311"], solve-group = "py311" }
py312 = { features = ["dev", "py312"], solve-group = "py312" }
py313 = { features = ["dev", "py313"], solve-group = "py313" }
