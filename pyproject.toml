[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "raman-bayes"
version = "0.1.0.dev0"
description = "Bayesian Raman peak-detection pipeline for hyperspectral maps (laptop, lab PC, Slurm)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sreya Vangara", email = "svangara@stanford.edu" }]
# License intentionally omitted until Stanford OTL clears BSD-3-Clause (DESIGN.md §2).
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=15",
    "zarr>=3.0,<4",
    "pydantic>=2.6,<3",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "duckdb>=1.0",
]

[project.scripts]
raman = "raman_bayes.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/raman_bayes"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".pixi"]

[tool.ruff.format]
# Code blocks in Markdown (DESIGN.md) are illustrative spec text; never reformat them.
exclude = ["*.md"]

[tool.ruff.lint]
# T20 (no print) applies to all of src/: app/ must never print, and cli/ writes through Rich.
# The second line enforces the CLAUDE.md code standards: C90 and PLR keep functions small and
# flat, ARG forbids unused parameters, ERA forbids commented-out code, TRY and BLE001 keep
# exception handling narrow (no bare `except Exception`), TD003 requires an issue link on every
# TODO, and D requires a contract docstring on every public object.
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "RUF", "NPY", "PT", "T20",
    "C90", "PLR", "ARG", "ERA", "TRY", "BLE001", "TD003", "D",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

# "Functions fit on a screen; more than five parameters means the arguments want to be a model."
# These are ruff's defaults, pinned so a ruff upgrade cannot loosen them.
[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "T20",
    # Test names state the behaviour under test; a docstring would repeat the name.
    "D101", "D102", "D103",
    # A literal expected value is the assertion; naming it as a constant would hide it.
    "PLR2004",
]
# Dummy backends and engines must match the Protocol signatures they stand in for, so their
# parameters are unused by design.
"tests/unit/test_ports.py" = ["ARG002"]
"tests/unit/typing_checks_ports.py" = ["ARG002"]
"scripts/**" = ["T20"]
"src/raman_bayes/cli/main.py" = [
    # Typer turns each command-line option into one function parameter, so a command's arity
    # is its option count (DESIGN.md §10) and cannot be grouped into a model.
    "PLR0913", "PLR0917",
    # Temporary: the stub commands ignore their parameters until each is implemented. Remove
    # in sub-step 14, when the last stub is replaced.
    "ARG001",
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
mypy_path = "src"

# pyarrow ships no type hints (no py.typed); scope the ignore to pyarrow only.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- import-linter
# The four contracts of DESIGN.md §2. tests/unit/test_import_contracts.py checks that the
# module lists cover every top-level module, so a new one must be allowed or forbidden here.
[tool.importlinter]
root_package = "raman_bayes"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "cli-imports"
name = "cli imports only app, domain, config and logging"
type = "forbidden"
source_modules = ["raman_bayes.cli"]
forbidden_modules = [
    "raman_bayes.ports",
    "raman_bayes.io",
    "raman_bayes.storage",
    "raman_bayes.preprocessing",
    "raman_bayes.engine",
    "raman_bayes.orchestration",
]
# cli -> app -> storage is fine; only direct imports are forbidden.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "nobody-imports-cli"
name = "nothing outside cli imports cli"
type = "forbidden"
source_modules = [
    "raman_bayes.domain",
    "raman_bayes.ports",
    "raman_bayes.io",
    "raman_bayes.storage",
    "raman_bayes.preprocessing",
    "raman_bayes.engine",
    "raman_bayes.orchestration",
    "raman_bayes.app",
    "raman_bayes.config",
    "raman_bayes.logging",
]
forbidden_modules = ["raman_bayes.cli"]

[[tool.importlinter.contracts]]
id = "domain-pure"
name = "domain imports no other subpackage"
type = "forbidden"
source_modules = ["raman_bayes.domain"]
forbidden_modules = [
    "raman_bayes.ports",
    "raman_bayes.io",
    "raman_bayes.storage",
    "raman_bayes.preprocessing",
    "raman_bayes.engine",
    "raman_bayes.orchestration",
    "raman_bayes.app",
    "raman_bayes.config",
    "raman_bayes.cli",
    "raman_bayes.logging",
]

[[tool.importlinter.contracts]]
id = "app-never-prints"
name = "app never imports rich or typer"
type = "forbidden"
source_modules = ["raman_bayes.app"]
forbidden_modules = ["rich", "typer"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
# Every warning is an error. An ignore must name one specific warning and carry a comment
# saying why; never add a blanket "ignore".
filterwarnings = ["error"]
